name: 'london_transport_pipeline'
version: '1.0.0'
profile: 'london_transport_pipeline'
config-version: 2
vars:
  max_reject_ratio: 0.1
  incremental_lookback: 2 hours
models:
  london_transport_pipeline:
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      dims:
        +materialized: table
      facts:
        +materialized: incremental
        +incremental_strategy: merge
        +on_schema_change: append_new_columns
