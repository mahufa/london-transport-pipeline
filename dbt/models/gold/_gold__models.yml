models:
  - name: dim_bike_point
    description: Latest attributes of each bike point.
    columns:
      - name: bike_point_id
        data_tests: [unique, not_null]
      - name: common_name
        data_tests: [not_null]
      - name: lat
        data_tests: [not_null]
      - name: lon
        data_tests: [not_null]

  - name: fct_bikes_availability_change
    description: Bike point availability at each update.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [bike_point_id, updated_at]
    columns:
      - name: bike_point_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bike_point')
                field: bike_point_id
      - name: updated_at
        data_tests: [not_null]
      - name: nb_standard_bikes
        data_tests: [not_null]
      - name: nb_e_bikes
        data_tests: [not_null]
      - name: nb_empty_docks
        data_tests: [not_null]
      - name: nb_docks
        data_tests: [not_null]
      - name: batch_id
        data_tests: [not_null]
      - name: loaded_at
        data_tests: [not_null]

  - name: dim_connector
    description: Latest attributes of each connector.
    columns:
      - name: connector_id
        data_tests: [unique, not_null]
      - name: power_kw
        data_tests: [not_null]
      - name: connector_type
        data_tests: [not_null]

  - name: dim_charging_station
    description: Latest attributes of each charging station.
    columns:
      - name: charging_station_id
        data_tests: [unique, not_null]
      - name: station_name
        data_tests: [not_null]
      - name: lat
        data_tests: [not_null]
      - name: lon
        data_tests: [not_null]

  - name: fct_connector_availability_change
    description: Connector availability at each update.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [connector_id, updated_at]
    columns:
      - name: connector_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_connector')
                field: connector_id
      - name: charging_station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_charging_station')
                field: charging_station_id
      - name: updated_at
        data_tests: [not_null]
      - name: status
        data_tests: [not_null]
      - name: batch_id
        data_tests: [not_null]
      - name: loaded_at
        data_tests: [not_null]
