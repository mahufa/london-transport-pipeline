models:
  - name: dim_bike_point
    description: Latest attributes of each bike point.
    columns:
      - name: bike_point_id
        data_tests: [unique, not_null]
      - name: common_name
        data_tests: [not_null]
      - name: lat
        data_tests: [not_null]
      - name: lon
        data_tests: [not_null]

  - name: fct_bikes_availability_change
    description: Bike point availability at each update.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [bike_point_id, updated_at]
    columns:
      - name: bike_point_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bike_point')
                field: bike_point_id
      - name: updated_at
        data_tests: [not_null]
      - name: nb_standard_bikes
        data_tests: [not_null]
      - name: nb_e_bikes
        data_tests: [not_null]
      - name: nb_empty_docks
        data_tests: [not_null]
      - name: nb_docks
        data_tests: [not_null]
      - name: batch_id
        data_tests: [not_null]
      - name: loaded_at
        data_tests: [not_null]
