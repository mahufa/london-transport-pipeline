              - batch_id
              - record_key
    columns:
      - name: batch_id
        data_tests: [not_null]
      - name: record_key
        data_tests: [not_null]
      - name: loaded_at
        data_tests: [not_null]

  - name: int_validated_bike_points
    data_tests:
