      - name: start_lon
        data_tests: [not_null]
      - name: end_lat
        data_tests: [not_null]
      - name: end_lon
        data_tests: [not_null]
      - name: severity
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]
      - name: subcategory
        data_tests: [not_null]
      - name: start_date_time
        data_tests: [not_null]
      - name: end_date_time
        data_tests: [not_null]
      - name: batch_id
        data_tests: [not_null]
      - name: loaded_at
        data_tests: [not_null]
