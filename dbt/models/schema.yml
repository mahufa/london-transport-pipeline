models:
  - name: stg_bike_points
    data_tests:
      - check_reject_ratio:
          arguments:
            source_name: bike_points
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - batch_id
              - record_key
    columns:
      - name: batch_id
        data_tests: [not_null]
      - name: record_key
        data_tests: [not_null]
      - name: loaded_at
        data_tests: [not_null]

  - name: stg_chargers
    data_tests:
      - check_reject_ratio:
          arguments:
            source_name: chargers
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - batch_id
              - record_key
    columns:
      - name: batch_id
        data_tests: [not_null]
      - name: record_key
        data_tests: [not_null]
      - name: loaded_at
        data_tests: [not_null]

  - name: stg_roads
    data_tests:
      - check_reject_ratio:
          arguments:
            source_name: roads
      - dbt_utils.unique_combination_of_columns:
          arguments:
