name: Tests
on:
  push:
    paths-ignore:
      - '**.md'
      - 'metabase_init/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build Airflow image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: tfl-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: >
          docker run --rm
          --network ${{ job.services.postgres.network }}
          -v "${{ github.workspace }}:/opt/airflow/project"
          -w /opt/airflow/project
          -e PYTHONPATH=/opt/airflow/project
          -e AIRFLOW__CORE__LOAD_EXAMPLES=false
          -e CONNECTION_CHECK_MAX_COUNT=0
          -e DW_TEST_DSN=postgresql://test:test@postgres:5432/test
          tfl-airflow:ci
          python -m pytest -p no:cacheprovider tests -q --durations=5
